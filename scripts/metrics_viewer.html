<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>uOmni Metrics Viewer</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.28);
      --text: #eef2ff;
      --text-soft: #dbe2ff;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --shadow: 0 20px 40px rgba(13, 17, 38, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Inter", Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 18%, rgba(34, 211, 238, 0.22), transparent 40%),
        radial-gradient(circle at 84% 12%, rgba(139, 92, 246, 0.26), transparent 46%),
        radial-gradient(circle at 74% 84%, rgba(59, 130, 246, 0.22), transparent 40%),
        linear-gradient(135deg, #0f1226, #171a36 48%, #101432);
      padding: 26px;
    }
    .shell {
      width: 100%;
      max-width: none;
      margin: 0;
      border-radius: 24px;
      padding: 18px 18px 16px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: var(--shadow);
    }
    h2 { margin: 0 0 6px; font-weight: 700; letter-spacing: 0.2px; }
    .muted { color: var(--text-soft); font-size: 12px; margin-bottom: 12px; }
    .glass {
      border-radius: 18px;
      padding: 12px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: end; }
    .tabs { display: flex; gap: 8px; margin: 8px 0 12px; flex-wrap: wrap; }
    .tab {
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 12px;
      transition: all 140ms ease;
    }
    .tab:hover { transform: translateY(-1px); border-color: rgba(255,255,255,0.46); }
    .tab.active {
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.75), rgba(34, 211, 238, 0.72));
      border-color: rgba(255,255,255,0.55);
      color: #fff;
      box-shadow: 0 8px 20px rgba(34, 211, 238, 0.25);
    }
    label { font-size: 12px; color: var(--text-soft); display: flex; flex-direction: column; gap: 4px; }
    select, button {
      min-width: 140px;
      padding: 7px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(12, 16, 38, 0.44);
      color: var(--text);
      outline: none;
    }
    select[multiple] {
      min-height: 84px;
      min-width: 170px;
    }
    button { cursor: pointer; background: linear-gradient(90deg, rgba(139, 92, 246, 0.65), rgba(34, 211, 238, 0.65)); border: 1px solid rgba(255,255,255,0.42); }
    button:hover { filter: brightness(1.06); }
    .status { margin: 4px 0 8px; font-size: 12px; color: var(--text-soft); }
    .panel { margin-top: 8px; }
    canvas {
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      width: 100%;
      max-width: none;
      height: 420px;
      background: rgba(10, 14, 34, 0.46);
    }
    table { border-collapse: separate; border-spacing: 0; margin-top: 12px; width: 100%; max-width: none; overflow: hidden; border-radius: 12px; }
    th, td { border: 1px solid rgba(255,255,255,0.14); padding: 7px; font-size: 12px; }
    th {
      background: rgba(255,255,255,0.15);
      color: #f8f9ff;
      text-align: left;
      font-weight: 600;
    }
    td { background: rgba(9, 13, 30, 0.36); color: #e9ecff; }
  </style>
</head>
<body>
  <div class="shell">
    <h2>uOmni Metrics Viewer</h2>
  <p class="muted">Loads logs through server API (<code>/api/metrics/*</code>). No manual upload required.</p>

    <div class="glass">
      <div class="row">
        <button id="refreshBtn">Refresh Logs</button>
        <label>Script <select id="script" multiple></select></label>
        <label>Run ID <select id="run" multiple></select></label>
        <label>Phase <select id="phase" multiple></select></label>
        <label>Metric <select id="metric" multiple></select></label>
        <label>X-axis
          <select id="xAxis">
            <option value="step">step</option>
            <option value="epoch">epoch</option>
          </select>
        </label>
        <label>Style
          <select id="chartStyle">
            <option value="line">line</option>
            <option value="smooth">smooth</option>
            <option value="area">area</option>
            <option value="scatter">scatter</option>
            <option value="dashed">dashed</option>
            <option value="dotted">dotted</option>
          </select>
        </label>
      </div>
      <div id="status" class="status"></div>
      <div id="tabs" class="tabs"></div>
      <div id="metricStyles" class="status"></div>
    </div>

    <div class="glass panel">
      <canvas id="chart" width="1200" height="420"></canvas>
      <table id="latestTable">
        <thead><tr><th>Metric</th><th>Latest Value</th><th>Step</th><th>Epoch</th><th>Timestamp</th></tr></thead>
        <tbody></tbody>
      </table>

      <div style="margin-top:12px; font-size:13px; color:var(--text-soft);">Events</div>
      <table id="eventsTable">
        <thead><tr><th>Event</th><th>Script</th><th>Run ID</th><th>Step</th><th>Epoch</th><th>Timestamp</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script>
    const KNOWN_METRICS_FILES = [
      "train_thinker.jsonl", "train_audio_enc.jsonl", "train_vision.jsonl", "train_talker.jsonl",
      "sft_omni.jsonl", "train_vocoder.jsonl", "train_ocr.jsonl",
      "test_thinker.jsonl", "test_audio_enc.jsonl", "test_vision.jsonl", "test_talker.jsonl",
      "test_vocoder.jsonl", "test_ocr.jsonl", "test_sft.jsonl"
    ];
    const fileData = new Map();
    let currentTab = "__all__";

    const scriptSel = document.getElementById("script");
    const runSel = document.getElementById("run");
    const phaseSel = document.getElementById("phase");
    const metricSel = document.getElementById("metric");
    const xAxisSel = document.getElementById("xAxis");
    const chartStyleSel = document.getElementById("chartStyle");
    const statusEl = document.getElementById("status");
    const tabsEl = document.getElementById("tabs");
    const metricStylesEl = document.getElementById("metricStyles");
    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");
    const metricStyleMap = {};

    function fill(sel, values) {
      sel.innerHTML = values.map(v => `<option>${v}</option>`).join("");
    }

    function selectedSet(sel) {
      return new Set([...sel.selectedOptions].map(o => String(o.value)));
    }

    function selectedArray(sel) {
      return [...sel.selectedOptions].map(o => String(o.value));
    }

    function rowsForTab() {
      if (currentTab === "__all__") {
        const rows = [];
        for (const arr of fileData.values()) rows.push(...arr);
        return rows;
      }
      return fileData.get(currentTab) || [];
    }

    function by(k) {
      const rows = rowsForTab();
      return [...new Set(rows.map(r => String(r[k] ?? "")))].sort();
    }

    function parsedLines(text) {
      return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
        try { return JSON.parse(l); } catch { return null; }
      }).filter(Boolean);
    }

    function normalizeName(pathOrName) {
      const p = String(pathOrName).replaceAll("\\", "/");
      return p.split("/").pop();
    }

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function buildTabs() {
      const names = [...fileData.keys()].sort();
      tabsEl.innerHTML = "";
      const addTab = (id, label) => {
        const btn = document.createElement("button");
        btn.className = "tab" + (currentTab === id ? " active" : "");
        btn.textContent = label;
        btn.addEventListener("click", () => {
          currentTab = id;
          buildTabs();
          resetFilters();
          render();
        });
        tabsEl.appendChild(btn);
      };
      addTab("__all__", `All (${names.length})`);
      for (const name of names) addTab(name, name);
    }

    function resetFilters() {
      fill(scriptSel, by("script"));
      fill(runSel, by("run_id"));
      const phaseRows = rowsForTab().filter(r => String(r.phase || "") !== "event");
      const phases = [...new Set(phaseRows.map(r => String(r.phase ?? "")))].sort();
      fill(phaseSel, phases);
      const metricRows = rowsForTab().filter(r => String(r.phase || "") !== "event");
      const metricNames = [...new Set(metricRows.map(r => String(r.metric_name ?? "")))].sort();
      fill(metricSel, metricNames);
      renderMetricStyleControls();
    }

    function styleOptions(selected) {
      const opts = ["line", "smooth", "area", "scatter", "dashed", "dotted"];
      return opts.map(s => `<option value="${s}" ${s === selected ? "selected" : ""}>${s}</option>`).join("");
    }

    function renderMetricStyleControls() {
      const explicit = selectedArray(metricSel);
      const allMetrics = [...new Set(rowsForTab()
        .filter(r => String(r.phase || "") !== "event")
        .map(r => String(r.metric_name ?? "")))].sort();
      const metrics = explicit.length ? explicit : allMetrics;
      if (!metrics.length) {
        metricStylesEl.innerHTML = "";
        return;
      }
      metricStylesEl.innerHTML = metrics.map(m => {
        const current = metricStyleMap[m] || chartStyleSel.value || "line";
        return `<label style="display:inline-flex; margin-right:10px; margin-top:6px;">${m}
          <select data-metric-style="${m}" style="min-width:120px;">${styleOptions(current)}</select>
        </label>`;
      }).join("");
      metricStylesEl.querySelectorAll("select[data-metric-style]").forEach(sel => {
        sel.addEventListener("change", (e) => {
          const metric = e.target.getAttribute("data-metric-style");
          metricStyleMap[metric] = e.target.value;
          render();
        });
      });
    }

    async function fetchJsonl(fileName) {
      const path = `/api/metrics/data?file=${encodeURIComponent(fileName)}`;
      try {
        const res = await fetch(path, { cache: "no-store" });
        if (!res.ok) return null;
        const payload = await res.json();
        if (!payload.ok || !Array.isArray(payload.rows)) return null;
        return payload.rows.length ? payload.rows : null;
      } catch {
        return null;
      }
    }

    async function discoverFromApi() {
      try {
        const res = await fetch("/api/metrics/files", { cache: "no-store" });
        if (!res.ok) return [];
        const payload = await res.json();
        if (!payload.ok || !Array.isArray(payload.files)) return [];
        return payload.files.map(normalizeName);
      } catch {
        return [];
      }
    }

    async function autoLoad() {
      setStatus("Loading metrics from server API ...");
      fileData.clear();
      const listed = await discoverFromApi();
      const candidates = [...new Set([...KNOWN_METRICS_FILES, ...listed])];

      for (const name of candidates) {
        const rows = await fetchJsonl(name);
        if (rows && rows.length) fileData.set(name, rows);
      }

      if (fileData.size === 0) {
        tabsEl.innerHTML = "";
        setStatus("No metrics found. Start a train/test run first.");
        render();
        return;
      }

      if (currentTab !== "__all__" && !fileData.has(currentTab)) currentTab = "__all__";
      buildTabs();
      resetFilters();
      setStatus(`Loaded ${fileData.size} metric files from logs/metrics.`);
      render();
    }

    function filtered() {
      const scripts = selectedSet(scriptSel);
      const runs = selectedSet(runSel);
      const phases = selectedSet(phaseSel);
      const metrics = selectedSet(metricSel);
      return rowsForTab().filter(r =>
        (String(r.phase || "") !== "event") &&
        (scripts.size === 0 || scripts.has(String(r.script))) &&
        (runs.size === 0 || runs.has(String(r.run_id))) &&
        (phases.size === 0 || phases.has(String(r.phase))) &&
        (metrics.size === 0 || metrics.has(String(r.metric_name)))
      );
    }

    function drawLine(data) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!data.length) return;
      const xKey = xAxisSel.value;
      const groups = new Map();
      for (const r of data) {
        const metric = String(r.metric_name ?? "");
        if (!groups.has(metric)) groups.set(metric, []);
        groups.get(metric).push({ x: Number(r[xKey] ?? 0), y: Number(r.metric_value ?? 0) });
      }
      for (const [k, pts] of groups.entries()) {
        groups.set(k, pts.filter(p => Number.isFinite(p.x) && Number.isFinite(p.y)).sort((a, b) => a.x - b.x));
      }
      const allPts = [...groups.values()].flat();
      if (!allPts.length) return;
      const minX = Math.min(...allPts.map(p => p.x));
      const maxX = Math.max(...allPts.map(p => p.x));
      const minY = Math.min(...allPts.map(p => p.y));
      const maxY = Math.max(...allPts.map(p => p.y));
      const pad = 40, w = canvas.width - pad * 2, h = canvas.height - pad * 2;
      const sx = (x) => pad + ((x - minX) / Math.max(1e-9, maxX - minX)) * w;
      const sy = (y) => pad + (1 - (y - minY) / Math.max(1e-9, maxY - minY)) * h;
      const palette = ["#22d3ee", "#f59e0b", "#8b5cf6", "#10b981", "#ef4444", "#f97316", "#60a5fa", "#a3e635"];
      const metrics = [...groups.keys()].sort();
      ctx.lineWidth = 2;
      metrics.forEach((metric, idx) => {
        const pts = groups.get(metric) || [];
        if (!pts.length) return;
        const color = palette[idx % palette.length];
        const style = metricStyleMap[metric] || chartStyleSel.value;
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.setLineDash([]);

        if (style === "scatter") {
          pts.forEach((p) => {
            ctx.beginPath();
            ctx.arc(sx(p.x), sy(p.y), 3, 0, Math.PI * 2);
            ctx.fill();
          });
          return;
        }

        if (style === "area") {
          ctx.beginPath();
          pts.forEach((p, i) => i ? ctx.lineTo(sx(p.x), sy(p.y)) : ctx.moveTo(sx(p.x), sy(p.y)));
          const last = pts[pts.length - 1];
          const first = pts[0];
          ctx.lineTo(sx(last.x), pad + h);
          ctx.lineTo(sx(first.x), pad + h);
          ctx.closePath();
          ctx.globalAlpha = 0.2;
          ctx.fill();
          ctx.globalAlpha = 1.0;
          ctx.beginPath();
          pts.forEach((p, i) => i ? ctx.lineTo(sx(p.x), sy(p.y)) : ctx.moveTo(sx(p.x), sy(p.y)));
          ctx.stroke();
          return;
        }

        if (style === "smooth") {
          ctx.beginPath();
          ctx.moveTo(sx(pts[0].x), sy(pts[0].y));
          for (let i = 1; i < pts.length; i++) {
            const prev = pts[i - 1];
            const curr = pts[i];
            const cx = (sx(prev.x) + sx(curr.x)) / 2;
            ctx.quadraticCurveTo(sx(prev.x), sy(prev.y), cx, (sy(prev.y) + sy(curr.y)) / 2);
          }
          const last = pts[pts.length - 1];
          ctx.lineTo(sx(last.x), sy(last.y));
          ctx.stroke();
          return;
        }

        if (style === "dashed") {
          ctx.setLineDash([10, 6]);
        } else if (style === "dotted") {
          ctx.setLineDash([2, 6]);
        }

        // default: line
        ctx.beginPath();
        pts.forEach((p, i) => i ? ctx.lineTo(sx(p.x), sy(p.y)) : ctx.moveTo(sx(p.x), sy(p.y)));
        ctx.stroke();
        ctx.setLineDash([]);
      });
      ctx.fillStyle = "#111"; ctx.font = "12px Arial";
      ctx.fillText(`${xKey}: ${minX} -> ${maxX}`, 8, 16);
      ctx.fillText(`value: ${minY.toFixed(4)} -> ${maxY.toFixed(4)}`, 8, 32);
      ctx.fillText(`metrics: ${metrics.length}`, 8, 48);
      metrics.slice(0, 6).forEach((m, i) => {
        const color = palette[i % palette.length];
        const y = 68 + i * 16;
        ctx.fillStyle = color;
        ctx.fillRect(8, y - 9, 10, 10);
        ctx.fillStyle = "#111";
        ctx.fillText(m, 24, y);
      });
    }

    function renderTable(data) {
      const body = document.querySelector("#latestTable tbody");
      const latest = new Map();
      data.forEach(r => {
        const key = String(r.metric_name);
        const x = Number(r.step ?? 0);
        if (!latest.has(key) || Number(latest.get(key).step ?? 0) <= x) latest.set(key, r);
      });
      const rows = [...latest.values()].sort((a, b) => String(a.metric_name).localeCompare(String(b.metric_name)));
      body.innerHTML = rows.map(r => `
        <tr>
          <td>${String(r.metric_name ?? "")}</td>
          <td>${Number(r.metric_value ?? 0).toFixed(6)}</td>
          <td>${String(r.step ?? "")}</td>
          <td>${String(r.epoch ?? "")}</td>
          <td>${String(r.timestamp ?? "")}</td>
        </tr>`).join("");
    }

    function renderEvents() {
      const body = document.querySelector("#eventsTable tbody");
      const scripts = selectedSet(scriptSel);
      const runs = selectedSet(runSel);
      const rows = rowsForTab()
        .filter(r =>
          String(r.phase || "") === "event" &&
          (scripts.size === 0 || scripts.has(String(r.script))) &&
          (runs.size === 0 || runs.has(String(r.run_id)))
        )
        .sort((a, b) => String(b.timestamp || "").localeCompare(String(a.timestamp || "")))
        .slice(0, 100);
      body.innerHTML = rows.map(r => `
        <tr>
          <td>${String(r.metric_name ?? "")}</td>
          <td>${String(r.script ?? "")}</td>
          <td>${String(r.run_id ?? "")}</td>
          <td>${String(r.step ?? "")}</td>
          <td>${String(r.epoch ?? "")}</td>
          <td>${String(r.timestamp ?? "")}</td>
        </tr>`).join("");
    }

    function render() {
      renderMetricStyleControls();
      const data = filtered();
      drawLine(data);
      renderTable(data);
      renderEvents();
    }

    document.getElementById("refreshBtn").addEventListener("click", autoLoad);
    [scriptSel, runSel, phaseSel, metricSel, xAxisSel, chartStyleSel].forEach(el => el.addEventListener("change", render));
    autoLoad();
  </script>
</body>
</html>
